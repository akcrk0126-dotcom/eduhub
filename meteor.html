<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#070b1f">
<title>메테오 디펜스</title>
<link rel="icon" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{ --bg:#070b1f; --panel:#111a44; --line:rgba(150,180,255,.18); --tx:#eef3ff; --sub:#97a6d6; --acc:#4fd8ff; --pink:#ff4fa3; --gold:#ffd23a; --bad:#ff5f6d; --ok:#3ef0a0; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--tx); font-family:'Pretendard','Noto Sans KR','Malgun Gothic',system-ui,sans-serif; overflow:hidden; touch-action:manipulation; user-select:none; -webkit-user-select:none; }
  body{ display:flex; flex-direction:column; height:100dvh; }
  button{ font:inherit; color:inherit; border:none; background:none; cursor:pointer; }
  svg.i{ width:20px; height:20px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; flex:none; }

  #game{ position:relative; flex:1; min-height:0; }
  #cv{ position:absolute; inset:0; width:100%; height:100%; display:block; }
  .hud{ position:absolute; left:0; right:0; top:0; display:flex; align-items:flex-start; gap:10px; padding:10px 10px 0 64px; pointer-events:none; }
  .hud .sc{ min-width:0; }
  .hud .sc b{ display:block; font-size:24px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.1; text-shadow:0 2px 8px rgba(0,0,0,.6); }
  .hud .sc span{ font-size:12.5px; font-weight:800; color:var(--sub); }
  .hud .sc span.hot{ color:var(--gold); }
  .hud .sc span.fever{ color:var(--pink); }
  .hud .mid{ flex:1; display:flex; flex-direction:column; align-items:center; gap:5px; padding-top:2px; }
  .hud .wv{ font-size:12px; font-weight:900; letter-spacing:.12em; color:var(--acc); }
  .hud .hp{ width:min(180px, 100%); height:10px; border-radius:99px; background:rgba(255,255,255,.12); overflow:hidden; border:1px solid rgba(255,255,255,.12); }
  .hud .hp i{ display:block; height:100%; width:100%; border-radius:99px; background:linear-gradient(90deg, #3ef0a0, #4fd8ff); transition:width .25s; }
  .hud .hp.low i{ background:linear-gradient(90deg, #ff5f6d, #ffa36b); }
  .hud .tools{ display:flex; gap:6px; pointer-events:auto; }
  .tb{ width:36px; height:36px; border-radius:11px; background:rgba(255,255,255,.1); display:flex; align-items:center; justify-content:center; }
  .tb:hover{ background:rgba(255,255,255,.18); }

  #banner{ position:absolute; left:0; right:0; top:28%; text-align:center; pointer-events:none; opacity:0; transform:scale(.8); transition:opacity .3s, transform .3s; }
  #banner.on{ opacity:1; transform:none; }
  #banner h2{ margin:0; font-size:clamp(34px, 9vw, 56px); font-weight:900; letter-spacing:.06em; color:#fff; text-shadow:0 0 24px rgba(79,216,255,.8); }
  #banner p{ margin:6px auto 0; display:inline-block; padding:6px 14px; border-radius:99px; background:rgba(255,210,58,.16); color:var(--gold); font-weight:900; font-size:15px; }
  #banner p:empty{ display:none; }
  #banner.boss h2{ color:#ffd0d6; text-shadow:0 0 24px rgba(255,80,100,.9); }

  /* 입력 · 키패드 */
  #ctl{ flex:none; padding:8px 10px calc(8px + env(safe-area-inset-bottom)); background:linear-gradient(#0b1233, #070b1f); border-top:1px solid var(--line); }
  .row{ width:min(460px, 100%); margin:0 auto 6px; display:flex; gap:6px; }
  .inbox{ flex:1; height:46px; border-radius:13px; background:rgba(0,0,0,.35); border:2px solid var(--line); display:flex; align-items:center; justify-content:center; gap:10px; position:relative; }
  .inbox b{ font-size:28px; font-weight:900; font-variant-numeric:tabular-nums; letter-spacing:.04em; min-width:1ch; }
  .inbox b:empty::after{ content:''; display:inline-block; width:3px; height:26px; background:var(--acc); vertical-align:middle; animation:blink 1s steps(1) infinite; }
  .inbox small{ position:absolute; right:12px; color:var(--sub); font-size:11.5px; font-weight:700; }
  .inbox.bad{ border-color:var(--bad); background:rgba(255,95,109,.18); animation:shake .3s; }
  .inbox.ok{ border-color:var(--ok); }
  .inbox.wait{ border-color:var(--gold); }
  @keyframes blink{ 50%{ opacity:0; } }
  @keyframes shake{ 25%{ transform:translateX(-6px); } 50%{ transform:translateX(6px); } 75%{ transform:translateX(-3px); } }
  .pw{ width:64px; height:46px; border-radius:13px; background:rgba(255,255,255,.07); display:flex; align-items:center; justify-content:center; gap:4px; font-weight:900; font-size:15px; position:relative; }
  .pw[disabled]{ opacity:.35; cursor:default; }
  .pw.bomb{ color:#ff8a7a; } .pw.frz{ color:#8fe6ff; }
  .pw small{ position:absolute; bottom:2px; right:5px; font-size:9.5px; color:var(--sub); font-weight:800; }
  .pad{ width:min(460px, 100%); margin:0 auto; display:grid; grid-template-columns:repeat(4, 1fr); gap:6px; }
  .pad button{ height:48px; border-radius:12px; background:rgba(255,255,255,.08); font-size:22px; font-weight:900; display:flex; align-items:center; justify-content:center; }
  .pad button:active{ background:rgba(79,216,255,.3); transform:scale(.96); }
  .pad .fn{ background:rgba(255,255,255,.04); color:var(--sub); }
  .pad .fire{ grid-row:span 2; height:auto; background:linear-gradient(180deg, #4fd8ff, #2a8cff); color:#04112e; font-size:17px; flex-direction:column; gap:4px; }
  .pad .zero{ grid-column:span 3; }
  @media (max-height:640px){ .pad button{ height:42px; } .inbox, .pw{ height:42px; } }

  /* 오버레이 */
  .ov{ position:fixed; inset:0; z-index:20; display:none; flex-direction:column; align-items:center; overflow-y:auto; padding:22px 14px calc(22px + env(safe-area-inset-bottom)); background:rgba(5,8,26,.84); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
  .ov.on{ display:flex; }
  .ov > *{ flex:none; }
  .ov .wrap{ width:min(560px, 100%); margin:auto 0; }
  #ovMenu{ background:radial-gradient(900px 500px at 50% -120px, #1d2a7a, rgba(5,8,26,.9) 70%); }
  .logo{ display:flex; flex-direction:column; align-items:center; text-align:center; margin:18px 0 14px; }
  .logo svg{ width:92px; height:92px; }
  .logo h1{ margin:6px 0 0; font-size:34px; font-weight:900; letter-spacing:.02em; }
  .logo p{ margin:6px 0 0; color:var(--sub); font-size:14px; line-height:1.6; }
  .modes{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .mode{ text-align:left; padding:14px; border-radius:16px; background:var(--panel); border:2px solid transparent; display:flex; flex-direction:column; gap:6px; position:relative; min-height:118px; }
  .mode:hover{ border-color:var(--c); }
  .mode .ic{ width:38px; height:38px; border-radius:11px; background:var(--c); color:#061033; display:flex; align-items:center; justify-content:center; font-weight:900; font-size:16px; }
  .mode b{ font-size:16px; } .mode small{ color:var(--sub); font-size:12px; line-height:1.45; }
  .mode .best{ position:absolute; right:12px; top:12px; font-size:11.5px; font-weight:900; color:var(--gold); }
  .how{ margin-top:12px; padding:12px 14px; border-radius:16px; background:rgba(255,255,255,.05); display:grid; grid-template-columns:1fr 1fr; gap:8px 12px; font-size:12.5px; color:var(--sub); line-height:1.45; }
  .how div{ display:flex; gap:8px; align-items:flex-start; }
  .how i{ flex:none; width:22px; height:22px; border-radius:7px; display:flex; align-items:center; justify-content:center; }
  .how b{ color:var(--tx); }
  .lbBox{ margin-top:12px; background:rgba(0,0,0,.25); border-radius:16px; padding:12px; }
  .lbBox h3{ margin:0 0 8px; font-size:15px; display:flex; align-items:center; justify-content:space-between; gap:8px; flex-wrap:wrap; }
  .lbTabs{ display:flex; gap:4px; flex-wrap:wrap; } .lbTabs button{ height:28px; padding:0 10px; border-radius:99px; background:rgba(255,255,255,.07); font-size:12px; font-weight:800; color:var(--sub); } .lbTabs button.on{ background:var(--acc); color:#061033; }
  .lb{ display:flex; flex-direction:column; gap:4px; }
  .lb .r{ display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:9px; background:rgba(255,255,255,.05); font-size:13.5px; }
  .lb .r.me{ background:rgba(79,216,255,.22); }
  .lb .n{ width:22px; text-align:center; font-weight:900; color:var(--sub); } .lb .n.g1{ color:var(--gold); } .lb .n.g2{ color:#d6e2f5; } .lb .n.g3{ color:#e59a5b; }
  .lb .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:800; }
  .lb small{ color:var(--sub); font-size:11.5px; } .lb .s{ font-weight:900; }
  .empty{ color:var(--sub); font-size:13px; padding:8px 0; text-align:center; }

  .ttl{ text-align:center; margin-bottom:14px; }
  .ttl small{ color:var(--acc); font-weight:900; letter-spacing:.14em; font-size:12px; }
  .ttl h2{ margin:4px 0 0; font-size:28px; font-weight:900; }
  .ttl p{ margin:6px 0 0; color:var(--sub); font-size:13.5px; }
  .cards{ display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; }
  @media (max-width:520px){ .cards, .how{ grid-template-columns:1fr; } .mode{ min-height:0; padding:12px; } .mode .best{ position:static; } }
  .card{ text-align:left; padding:16px 14px; border-radius:18px; background:linear-gradient(180deg, #17245e, #0f1740); border:2px solid rgba(255,255,255,.08); display:flex; flex-direction:column; gap:8px; position:relative; transition:transform .15s, border-color .15s; animation:pop .35s backwards; }
  .card:nth-child(2){ animation-delay:.07s; } .card:nth-child(3){ animation-delay:.14s; }
  .card:hover{ transform:translateY(-3px); border-color:var(--c); }
  .card .ic{ width:52px; height:52px; border-radius:15px; background:var(--c); color:#061033; display:flex; align-items:center; justify-content:center; }
  .card .ic svg{ width:30px; height:30px; }
  .card b{ font-size:17px; } .card small{ color:var(--sub); font-size:12.5px; line-height:1.5; }
  .card .lv{ position:absolute; right:12px; top:12px; font-size:11px; font-weight:900; color:var(--sub); }
  .card .key{ position:absolute; right:12px; bottom:10px; width:22px; height:22px; border-radius:6px; background:rgba(255,255,255,.1); font-size:12px; font-weight:900; display:flex; align-items:center; justify-content:center; color:var(--sub); }
  @keyframes pop{ from{ opacity:0; transform:translateY(16px) scale(.95); } }

  .res{ text-align:center; }
  .res .big{ font-size:56px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1.1; margin-top:6px; background:linear-gradient(180deg, #fff, #8fe6ff); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .res .new{ display:inline-block; margin-top:6px; padding:4px 12px; border-radius:99px; background:var(--gold); color:#2a1c00; font-weight:900; font-size:13px; }
  .grid4{ display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin:14px 0; }
  .grid4 div{ background:rgba(255,255,255,.06); border-radius:12px; padding:10px 4px; display:flex; flex-direction:column; gap:2px; }
  .grid4 b{ font-size:20px; font-weight:900; } .grid4 small{ font-size:11.5px; color:var(--sub); }
  .review{ text-align:left; background:rgba(255,255,255,.05); border-radius:14px; padding:12px; margin-bottom:12px; }
  .review h3{ margin:0 0 8px; font-size:14px; }
  .review .w{ display:flex; justify-content:space-between; padding:6px 4px; border-top:1px solid rgba(255,255,255,.07); font-size:15px; font-weight:800; font-variant-numeric:tabular-nums; }
  .review .w b{ color:var(--ok); }
  .btns{ display:flex; gap:8px; margin-top:12px; }
  .btns button{ flex:1; height:50px; border-radius:14px; background:rgba(255,255,255,.1); font-weight:900; font-size:16px; }
  .btns .pri{ background:linear-gradient(180deg, #4fd8ff, #2a8cff); color:#04112e; }
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div class="hud">
    <div class="sc"><b id="hScore">0</b><span id="hCombo">콤보 0</span></div>
    <div class="mid"><span class="wv" id="hWave">WAVE 1</span><div class="hp" id="hpBox"><i id="hHp"></i></div></div>
    <div class="tools">
      <button class="tb" id="bMute" title="소리"></button>
      <button class="tb" id="bPause" title="일시정지 (Esc)"><svg class="i" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></svg></button>
    </div>
  </div>
  <div id="banner"><h2 id="bnT"></h2><br><p id="bnS"></p></div>
</div>
<div id="ctl">
  <div class="row">
    <button class="pw bomb" id="bBomb" title="폭탄 (B)"><svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="14" r="6"/><path d="M15 9l3-3M18 3v2M21 6h-2M19.5 4.5l1-1"/></svg><span id="nBomb">0</span><small>B</small></button>
    <div class="inbox" id="inbox"><b id="buf"></b><small id="hint"></small></div>
    <button class="pw frz" id="bFrz" title="시간 정지 (F)"><svg class="i" viewBox="0 0 24 24"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7M9 4l3 2 3-2M9 20l3-2 3 2"/></svg><span id="nFrz">0</span><small>F</small></button>
  </div>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button><button data-k="back" class="fn"><svg class="i" viewBox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12zM17 9l-5 6M12 9l5 6"/></svg></button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button><button data-k="-" class="fn">−</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="fire" class="fire"><svg class="i" viewBox="0 0 24 24" style="width:26px;height:26px"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/></svg>발사</button>
    <button data-k="0" class="zero">0</button>
  </div>
</div>

<!-- 메뉴 -->
<div class="ov on" id="ovMenu"><div class="wrap">
  <div class="logo">
    <svg viewBox="0 0 100 100"><defs><radialGradient id="lg1" cx=".35" cy=".35"><stop offset="0" stop-color="#ffcf9a"/><stop offset="1" stop-color="#9a5a3a"/></radialGradient></defs>
      <path d="M70 18L40 48" stroke="#ff9a3a" stroke-width="14" stroke-linecap="round" opacity=".35"/><path d="M76 12L48 40" stroke="#ffd23a" stroke-width="6" stroke-linecap="round" opacity=".6"/>
      <circle cx="38" cy="52" r="20" fill="url(#lg1)"/><circle cx="32" cy="48" r="4" fill="#7a4028" opacity=".6"/><circle cx="44" cy="58" r="3" fill="#7a4028" opacity=".6"/>
      <path d="M50 96L40 60" stroke="#4fd8ff" stroke-width="4" stroke-linecap="round"/><path d="M8 100Q50 78 92 100" fill="#2a3a8a"/><circle cx="50" cy="90" r="6" fill="#4fd8ff"/></svg>
    <h1>메테오 디펜스</h1>
    <p>메테오에 적힌 문제의 답을 입력하면 레이저가 발사돼요.<br>행성을 지키고, 웨이브마다 업그레이드를 골라 더 강해지세요!</p>
  </div>
  <div class="modes" id="modes"></div>
  <div class="how">
    <div><i style="background:#e8b830"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#2a1c00"><path d="M12 3l2.6 5.6 6 .7-4.5 4.1 1.2 6L12 16.5 6.7 19.4l1.2-6L3.4 9.3l6-.7z"/></svg></i><span><b>골드</b> 점수 3배</span></div>
    <div><i style="background:#7fdcff"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#04263a"><path d="M12 2v20M3.3 7l17.4 10M3.3 17L20.7 7"/></svg></i><span><b>얼음</b> 모두 4초 멈춤</span></div>
    <div><i style="background:#ff6a5a"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#3a0606"><circle cx="11" cy="14" r="6"/><path d="M15 9l3-3"/></svg></i><span><b>폭탄</b> 화면 전체 폭발</span></div>
    <div><i style="background:#3ecf8e"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#063a22"><path d="M12 5v14M5 12h14"/></svg></i><span><b>회복</b> 쉴드 +20</span></div>
    <div style="grid-column:1/-1"><i style="background:#ff4fa3"><svg class="i" viewBox="0 0 24 24" style="width:14px;height:14px;stroke:#3a0620"><path d="M13 2L4 14h7l-1 8 9-12h-7z"/></svg></i><span>연속으로 맞히면 점수 배율이 오르고, <b>20콤보마다 피버</b>! 실수하면 콤보가 끊겨요.</span></div>
  </div>
  <div class="lbBox"><h3>랭킹 <span class="lbTabs" id="lbTabs"></span></h3><div class="lb" id="lbList"><div class="empty">불러오는 중…</div></div></div>
</div></div>

<!-- 업그레이드 -->
<div class="ov" id="ovUp"><div class="wrap">
  <div class="ttl"><small id="upW">WAVE 1 CLEAR</small><h2>업그레이드를 고르세요</h2><p id="upSub"></p></div>
  <div class="cards" id="cards"></div>
</div></div>

<!-- 일시정지 -->
<div class="ov" id="ovPause"><div class="wrap" style="max-width:360px">
  <div class="ttl"><small>PAUSED</small><h2>일시정지</h2><p id="pInfo"></p></div>
  <div class="btns" style="flex-direction:column"><button class="pri" id="bResume">계속하기</button><button id="bGiveUp">그만하고 결과 보기</button></div>
</div></div>

<!-- 결과 -->
<div class="ov" id="ovEnd"><div class="wrap"><div class="res" id="res"></div></div></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js" crossorigin="anonymous" onerror="window.__mpFail=true"></script>
<script src="multiplayer.js" onerror="window.__mpFail=true"></script>
<script>
(function(){
'use strict';
const $ = id=>document.getElementById(id);
const esc = s=>String(s).replace(/[&<>"']/g, c=>({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
const R = (a, b)=>a + Math.floor(Math.random()*(b - a + 1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
const clamp = (v, a, b)=>Math.max(a, Math.min(b, v));
const fmt = n=>(Math.round(n) || 0).toLocaleString();
const store = { get(k, d){ try { const v = localStorage.getItem('md_' + k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { localStorage.setItem('md_' + k, JSON.stringify(v)); } catch(e){} } };

// ================= 문제 =================
// 문제 = { t:'7 × 8', a:56, d:난이도 1~5 }
const TOP = {
  add1:{ n:'덧셈', f:()=>{ const a = R(1, 9), b = R(1, 9); return { t:a + ' + ' + b, a:a + b, d:1 }; } },
  add2:{ n:'두 자리 덧셈', f:()=>{ const a = R(11, 59), b = R(3, 39); return { t:a + ' + ' + b, a:a + b, d:2 }; } },
  add3:{ n:'세 자리 덧셈', f:()=>{ const a = R(100, 499), b = R(20, 399); return { t:a + ' + ' + b, a:a + b, d:3 }; } },
  sub1:{ n:'뺄셈', f:()=>{ const a = R(5, 18), b = R(1, a - 1); return { t:a + ' − ' + b, a:a - b, d:1 }; } },
  sub2:{ n:'두 자리 뺄셈', f:()=>{ const a = R(30, 99), b = R(11, a - 5); return { t:a + ' − ' + b, a:a - b, d:2 }; } },
  sub3:{ n:'세 자리 뺄셈', f:()=>{ const a = R(200, 999), b = R(50, a - 20); return { t:a + ' − ' + b, a:a - b, d:3 }; } },
  mulE:{ n:'2단 · 5단', f:()=>{ const a = pick([2, 5]), b = R(1, 9); return { t:a + ' × ' + b, a:a*b, d:1 }; } },
  mul:{ n:'구구단', f:()=>{ const a = R(2, 9), b = R(2, 9); return { t:a + ' × ' + b, a:a*b, d:2 }; } },

  for (let i = 0; i < b.segs; i++){ ctx.fillStyle = i < b.left ? '#ff4f6a' : 'rgba(255,255,255,.18)'; roundRect(-tot/2 + i*(pw + gap), -w*.14 - 26, pw, 7, 3); ctx.fill(); }
  // 문제
  ctx.font = '900 ' + (W < 420 ? 21 : 24) + 'px Pretendard, "Noto Sans KR", system-ui, sans-serif'; const lw = ctx.measureText(b.q.t).width + 28, lh = 38, ly = w*.12 + 26;
  const match = buf && buf !== '-' && b.ans.startsWith(buf);
  ctx.fillStyle = 'rgba(40,6,20,.9)'; roundRect(-lw/2, ly - lh/2, lw, lh, 12); ctx.fill(); ctx.lineWidth = 3; ctx.strokeStyle = match ? '#ffd23a' : '#ff4f6a'; ctx.stroke();
  ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(b.q.t, 0, ly + 1);
  ctx.restore();
}

// ================= 소리 =================
let AC = null, muted = store.get('mute', false), noiseBuf = null;
function audio(){ if (muted) return null; try { if (!AC){ AC = new (window.AudioContext || window.webkitAudioContext)(); const n = AC.sampleRate*.6; noiseBuf = AC.createBuffer(1, n, AC.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < n; i++) d[i] = Math.random()*2 - 1; } if (AC.state === 'suspended') AC.resume(); } catch(e){} return AC; }
function tone(type, f1, f2, dur, vol, delay){ const ac = audio(); if (!ac) return; const t = ac.currentTime + (delay || 0), o = ac.createOscillator(), g = ac.createGain(); o.type = type; o.frequency.setValueAtTime(f1, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t + dur + .02); }
function noise(dur, vol, freq){ const ac = audio(); if (!ac || !noiseBuf) return; const t = ac.currentTime, s = ac.createBufferSource(), f = ac.createBiquadFilter(), g = ac.createGain(); s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t); f.frequency.exponentialRampToValueAtTime(80, t + dur); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t + dur); s.connect(f); f.connect(g); g.connect(ac.destination); s.start(t); s.stop(t + dur); }
function sfx(k){ if (muted) return;
  if (k === 'boom'){ tone('sawtooth', 1400 + Math.min(20, S ? S.combo : 0)*40, 180, .12, .06); noise(.35, .25, 2400); }
  else if (k === 'bigboom'){ noise(.9, .45, 1600); tone('sine', 120, 40, .6, .3); }
  else if (k === 'hurt'){ tone('sine', 160, 40, .45, .35); noise(.4, .3, 900); }
  else if (k === 'bad'){ tone('square', 180, 120, .16, .07); }
  else if (k === 'combo'){ [880, 1108, 1318].forEach((f, i)=>tone('triangle', f, 0, .12, .07, i*.05)); }
  else if (k === 'fever'){ [523, 659, 784, 1046, 1318].forEach((f, i)=>tone('square', f, 0, .14, .05, i*.06)); }
  else if (k === 'clear'){ [523, 784, 1046].forEach((f, i)=>tone('triangle', f, 0, .25, .09, i*.1)); }
  else if (k === 'open'){ tone('triangle', 660, 990, .2, .06); }
  else if (k === 'pick'){ tone('triangle', 784, 1568, .18, .08); }
  else if (k === 'freeze'){ tone('sine', 2200, 600, .5, .08); tone('triangle', 1800, 900, .4, .05, .05); }
  else if (k === 'alarm'){ for (let i = 0; i < 3; i++){ tone('square', 440, 0, .18, .06, i*.4); tone('square', 330, 0, .18, .06, i*.4 + .2); } }
}
function renderMute(){ $('bMute').innerHTML = muted ? '<svg class="i" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM22 9l-6 6M16 9l6 6"/></svg>' : '<svg class="i" viewBox="0 0 24 24"><path d="M11 5L6 9H3v6h3l5 4zM15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg>'; }
$('bMute').onclick = ()=>{ muted = !muted; store.set('mute', muted); renderMute(); };

// ================= 화면 =================
function show(id){ ['ovMenu', 'ovUp', 'ovPause', 'ovEnd'].forEach(o=>$(o).classList.toggle('on', o === id)); }
function hideOv(){ show(null); }
function hud(){
  if (!S) return;
  $('hScore').textContent = fmt(S.score);
  const c = $('hCombo'); c.textContent = S.feverT > 0 ? 'FEVER  콤보 ' + S.combo + ' · x' + mult()*2 : '콤보 ' + S.combo + (mult() > 1 ? ' · x' + mult() : ''); c.className = S.feverT > 0 ? 'fever' : (mult() > 1 ? 'hot' : '');
  $('hWave').textContent = (S.w%5 === 0 ? 'BOSS · ' : '') + 'WAVE ' + S.w;
  $('hHp').style.width = clamp(S.hp/S.maxHp*100, 0, 100) + '%'; $('hpBox').classList.toggle('low', S.hp < S.maxHp*.3);
  $('nBomb').textContent = S.bombs; $('bBomb').disabled = S.bombs <= 0; $('nFrz').textContent = S.freezes; $('bFrz').disabled = S.freezes <= 0;
}
function togglePause(force){ if (!S || S.phase === 'over' || S.phase === 'pick') return; S.paused = force != null ? force : !S.paused;
  if (S.paused){ $('pInfo').textContent = 'WAVE ' + S.w + ' · ' + fmt(S.score) + '점 · 쉴드 ' + Math.ceil(S.hp); show('ovPause'); } else hideOv(); }
$('bPause').onclick = ()=>togglePause();
$('bResume').onclick = ()=>togglePause(false);
$('bGiveUp').onclick = ()=>{ if (S){ S.paused = false; gameOver(true); } };
document.addEventListener('visibilitychange', ()=>{ if (document.hidden && S && S.phase === 'wave' && !S.paused) togglePause(true); });

const best = store.get('best', {});
function buildMenu(){
  $('modes').innerHTML = Object.entries(MODES).map(([k, m])=>'<button class="mode" data-m="' + k + '" style="--c:' + m.col + '"><span class="ic">' + m.ic + '</span><b>' + m.name + '</b><small>' + m.desc + '</small>' + (best[k] ? '<span class="best">최고 ' + fmt(best[k]) + '</span>' : '') + '</button>').join('');
  $('lbTabs').innerHTML = Object.entries(MODES).map(([k, m])=>'<button class="' + (k === lbMode ? 'on' : '') + '" data-m="' + k + '">' + m.name.replace(' 디펜스', '') + '</button>').join('');
}
let lbMode = 'grow';
$('modes').onclick = e=>{ const b = e.target.closest('[data-m]'); if (b) start(b.dataset.m); };
$('lbTabs').onclick = e=>{ const b = e.target.closest('[data-m]'); if (!b) return; lbMode = b.dataset.m; buildMenu(); loadRank($('lbList'), lbMode, 10); };

function start(mode){
  audio();
  S = newState(mode); buf = ''; P.length = BEAMS.length = RINGS.length = TXT.length = 0;
  hideOv(); renderBuf(); startWave();
}
function gameOver(quit){
  if (!S || S.phase === 'over') return;
  S.phase = 'over'; buf = ''; renderBuf();
  if (!quit){ const tp = turretPos(); for (let i = 0; i < 8; i++) setTimeout(()=>explode(tp.x + (Math.random() - .5)*W*.6, surfY(W/2) + (Math.random())*10, 50, pick(['#ff7a5a', '#ffd23a', '#fff'])), i*120); shake = 30; sfx('bigboom'); }
  setTimeout(finish, quit ? 0 : 1600);
}
function finish(){
  const m = MODES[S.mode], tot = S.solved + S.wrongN, acc = tot ? Math.round(S.solved/tot*100) : 0;
  if (S.w > store.get('wave', 0)) store.set('wave', S.w);
  const isNew = S.score > (best[S.mode] || 0); if (isNew){ best[S.mode] = S.score; store.set('best', best); }
  const seen = new Set(), miss = S.missed.filter(q=>{ if (seen.has(q.t)) return false; seen.add(q.t); return true; }).slice(-8);
  $('res').innerHTML = '<div class="ttl" style="margin:0"><small>GAME OVER · ' + esc(m.name) + '</small></div><div class="big">' + fmt(S.score) + '</div>'
    + (isNew && S.score ? '<span class="new">새 최고 기록!</span>' : '<div style="color:var(--sub);font-size:13px;margin-top:4px">최고 ' + fmt(best[S.mode] || 0) + '점</div>')
    + '<div class="grid4"><div><b>' + S.w + '</b><small>웨이브</small></div><div><b>' + S.solved + '</b><small>푼 문제</small></div><div><b>' + acc + '%</b><small>정확도</small></div><div><b>' + S.maxC + '</b><small>최대 콤보</small></div></div>'
    + (miss.length ? '<div class="review"><h3>놓친 문제 다시 보기</h3>' + miss.map(q=>'<div class="w"><span>' + esc(q.t) + '</span><b>' + (q.t.includes('□') ? '□ = ' : '= ') + q.a + '</b></div>').join('') + '</div>' : '')
    + '<div class="lbBox" style="margin:0;text-align:left"><h3>' + esc(m.name) + ' 랭킹</h3><div class="lb" id="endLb"><div class="empty">불러오는 중…</div></div></div>'
    + '<div class="btns"><button id="bMenu">모드 선택</button><button class="pri" id="bAgain">다시 하기</button></div>';
  const mode = S.mode;
  $('bAgain').onclick = ()=>start(mode); $('bMenu').onclick = ()=>{ S = null; lbMode = mode; buildMenu(); show('ovMenu'); loadRank($('lbList'), lbMode, 10); };
  show('ovEnd');
  const show5 = ()=>loadRank($('endLb'), mode, 5);
  if (S.score > 0 && mpOn) withAuth(ok=>{ if (ok) MP.submitScore('meteor_' + mode, S.score, 'desc', { n:S.w }, show5); else show5(); }); else show5();
  try { if (mpOn && MP.addXP && S.solved) MP.addXP(Math.min(60, 5 + Math.floor(S.solved/2) + S.w*2)); } catch(e){}
}

// ================= 랭킹 =================
const mpOn = !window.__mpFail && typeof firebase !== 'undefined' && window.MP && MP.isConfigured && MP.isConfigured();
let authQ = null;
function withAuth(cb){ if (!mpOn){ cb(false); return; } if (MP.uid){ cb(true); return; }
  if (authQ){ authQ.push(cb); return; }
  const q = authQ = [cb]; let fin = false;
  const done = ok=>{ if (fin) return; fin = true; authQ = null; clearTimeout(to); q.forEach(f=>f(ok)); };
  const to = setTimeout(()=>done(!!MP.uid), 8000);
  try { MP.initAuthOnly(u=>{ if (u) done(true); }); } catch(e){ done(false); } }
function loadRank(el, mode, limit){ if (!el) return; if (!mpOn){ el.innerHTML = '<div class="empty">오프라인이라 랭킹을 볼 수 없어요</div>'; return; }
  withAuth(ok=>{ if (!ok){ el.innerHTML = '<div class="empty">서버에 연결하지 못했어요</div>'; return; }
    MP.fetchLeaderboard('meteor_' + mode, { limit, direction:'desc' }, arr=>{ el.innerHTML = !arr.length ? '<div class="empty">아직 기록이 없어요. 첫 번째 수호자가 되어 보세요!</div>'
      : arr.map((r, i)=>'<div class="r' + (r.uid === MP.uid ? ' me' : '') + '"><span class="n' + (i < 3 ? ' g' + (i + 1) : '') + '">' + (i + 1) + '</span><span class="nm">' + esc(r.name || '플레이어') + (r.uid === MP.uid ? ' (나)' : '') + '</span><small>웨이브 ' + (+r.n || 0) + '</small><span class="s">' + fmt(+r.score || 0) + '</span></div>').join(''); }); }); }

// ================= 시작 =================
let last = 0, hudT = 0;
function loop(now){
  requestAnimationFrame(loop);
  const dt = Math.min(.05, (now - last)/1000 || 0); last = now;
  if (S && !S.paused){ if (S.phase === 'wave' || S.phase === 'clear') update(dt); updFx(dt); hudT += dt; if (hudT > .2){ hudT = 0; hud(); } }
  else if (!S) updFx(dt);
  draw(now);
}
resize(); renderMute(); buildMenu(); loadRank($('lbList'), lbMode, 10);
requestAnimationFrame(loop);
if (mpOn) withAuth(ok=>{ if (ok) try { MP.setPresence('meteor', null); } catch(e){} });
window.__MD = { get S(){ return S; }, press, start, TOP, MODES, pool, genQ:b=>genQ(b), takeUp, kill, finish:()=>gameOver(true) };
})();
</script>
